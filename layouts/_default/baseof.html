<!doctype html>
<html lang="en">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}page-home{{ else }}page-{{ .Type }}{{ end }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/main.js?v={{ now.Unix }}" defer></script>
</body>
</html>
