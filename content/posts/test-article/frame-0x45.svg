<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 150" font-family="IBM Plex Mono, monospace" font-size="13" text-anchor="middle">
  <style>
    .sig { fill: none; stroke: #b0612d; stroke-width: 2.5; }
    .data { fill: #b0612d; fill-opacity: .1; }
    .grid { stroke: #d5d9e0; stroke-width: 1; }
    .t { fill: #5b6270; }
    .v { fill: #1f2329; font-weight: 500; }
    @media (prefers-color-scheme: dark) {
      .sig { stroke: #e0a46e; } .data { fill: #e0a46e; }
      .grid { stroke: #3a3f48; } .t { fill: #a9afba; } .v { fill: #eceef2; }
    }
  </style>
  <rect class="data" x="140" y="22" width="400" height="66"/>
  <g class="grid">
    <line x1="90" y1="20" x2="90" y2="95"/><line x1="140" y1="20" x2="140" y2="95"/>
    <line x1="190" y1="20" x2="190" y2="95"/><line x1="240" y1="20" x2="240" y2="95"/>
    <line x1="290" y1="20" x2="290" y2="95"/><line x1="340" y1="20" x2="340" y2="95"/>
    <line x1="390" y1="20" x2="390" y2="95"/><line x1="440" y1="20" x2="440" y2="95"/>
    <line x1="490" y1="20" x2="490" y2="95"/><line x1="540" y1="20" x2="540" y2="95"/>
    <line x1="590" y1="20" x2="590" y2="95"/>
  </g>
  <path class="sig" d="M40 30 H90 V80 H140 V30 H190 V80 H240 V30 H290 V80 H440 V30 H490 V80 H540 V30 H640"/>
  <g class="t">
    <text x="65" y="115">idle</text><text x="115" y="115">start</text>
    <text x="165" y="115">d0</text><text x="215" y="115">d1</text><text x="265" y="115">d2</text>
    <text x="315" y="115">d3</text><text x="365" y="115">d4</text><text x="415" y="115">d5</text>
    <text x="465" y="115">d6</text><text x="515" y="115">d7</text>
    <text x="565" y="115">stop</text><text x="615" y="115">idle</text>
  </g>
  <g class="v">
    <text x="115" y="137">0</text>
    <text x="165" y="137">1</text><text x="215" y="137">0</text><text x="265" y="137">1</text>
    <text x="315" y="137">0</text><text x="365" y="137">0</text><text x="415" y="137">0</text>
    <text x="465" y="137">1</text><text x="515" y="137">0</text>
    <text x="565" y="137">1</text>
  </g>
